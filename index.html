<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hingram</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Tông màu tối giản */
        :root {
            --bg-color: #f7f7f7;
            --container-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --border-color: #e0e0e0;
            --btn-bg: #222222;
            --btn-text: #ffffff;
            --link-color: #000000;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0; display: flex; justify-content: center;
        }
        .screen { display: none; width: 100%; max-width: 600px; min-height: 100vh; background: var(--container-bg); border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); }
        .active { display: block; }
        
        /* ============== CHỈNH SỬA KHU VỰC AUTH ============== */
        #auth-screen {
            background-color: var(--bg-color); /* Nền xám nhạt */
            border: none;
            max-width: 100%;
        }
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 380px; /* Khung đăng nhập nhỏ gọn ở giữa */
            background: var(--container-bg);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06); /* Đổ bóng nhẹ */
            border: 1px solid var(--border-color);
        }
        .auth-card h1 { text-align: center; margin-top: 0; margin-bottom: 30px; font-weight: 700; letter-spacing: 1px; font-size: 28px; }
        
        input { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; background: #fafafa; outline: none; transition: 0.2s; }
        input:focus { border-color: #999; background: #fff; }
        
        button { width: 100%; padding: 14px; background: var(--btn-bg); color: var(--btn-text); border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 15px; transition: 0.2s; }
        button:hover { background: #000; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        
        /* Style cho dòng chữ chuyển đổi */
        .toggle-text { text-align: center; color: var(--text-muted); font-size: 14px; margin-top: 5px; }
        .action-link { color: var(--link-color); font-weight: 600; cursor: pointer; text-decoration: none; margin-left: 4px; }
        .action-link:hover { text-decoration: underline; }
        
        .step { display: none; }
        .step.active-step { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* ... (Các CSS của Home, Modal giữ nguyên như cũ) ... */
        .header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; background: var(--container-bg); z-index: 10; }
        .avatar-btn { width: 36px; height: 36px; border-radius: 50%; background: #ddd; cursor: pointer; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #555; }
        .post { padding: 20px; border-bottom: 1px solid var(--border-color); }
        .post-header { display: flex; align-items: center; margin-bottom: 10px; }
        .post-avatar { width: 32px; height: 32px; border-radius: 50%; background: #eee; margin-right: 10px; }
        .post-author { font-weight: 600; font-size: 14px; }
        .post-content { font-size: 15px; line-height: 1.5; margin-bottom: 15px; }
        .post-actions button { width: auto; padding: 6px 12px; background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 20px; font-size: 13px; margin-right: 10px; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--container-bg); display: none; z-index: 1000; overflow-y: auto; padding: 20px; }
        .modal-active { display: block; }
        .close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- ================= MÀN HÌNH XÁC THỰC ================= -->
    <div id="auth-screen" class="screen active">
        <div class="auth-wrapper">
            <div class="auth-card">
                <h1>HINGRAM</h1>
                
                <!-- Khu vực Đăng nhập -->
                <div id="login-section">
                    <input type="email" id="login-email" placeholder="Email">
                    <input type="password" id="login-password" placeholder="Mật khẩu">
                    <button onclick="handleLogin()">Đăng nhập</button>
                    
                    <!-- Chữ "Đăng ký" được tách riêng để bấm -->
                    <div class="toggle-text">
                        Bạn chưa có tài khoản? <span class="action-link" onclick="toggleAuthMode()">Đăng ký</span>
                    </div>
                </div>

                <!-- Khu vực Đăng ký -->
                <div id="register-section" style="display: none;">
                    
                    <!-- Bước 1: Nhập Tên & Email -->
                    <div id="reg-step-1" class="step active-step">
                        <input type="text" id="reg-name" placeholder="Tên hiển thị">
                        <input type="email" id="reg-email" placeholder="Email">
                        <button onclick="sendOTP()" id="btn-send-otp">Tiếp tục</button>
                    </div>
                    
                    <!-- Bước 2: Nhập mã xác minh -->
                    <div id="reg-step-2" class="step">
                        <p style="font-size: 13px; color: var(--text-muted); text-align: center; margin-top: 0;">Mã 6 chữ số đã được gửi đến email của bạn</p>
                        <input type="text" id="reg-otp" placeholder="Nhập mã xác minh" maxlength="6">
                        <button onclick="verifyOTP()" id="btn-verify-otp">Xác nhận</button>
                        <button onclick="setRegStep(1)" style="background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); margin-top: 5px;">Quay lại</button>
                    </div>
                    
                    <!-- Bước 3: Đặt mật khẩu -->
                    <div id="reg-step-3" class="step">
                        <p style="font-size: 13px; color: var(--text-muted); text-align: center; margin-top: 0;">Xác minh thành công. Hãy đặt mật khẩu.</p>
                        <input type="password" id="reg-password" placeholder="Mật khẩu mới">
                        <input type="password" id="reg-password-confirm" placeholder="Xác nhận mật khẩu">
                        <button onclick="completeRegistration()">Đăng ký</button>
                    </div>
                    
                    <!-- Chữ "Đăng nhập" được tách riêng để bấm -->
                    <div class="toggle-text" id="reg-toggle-text">
                        Bạn đã có tài khoản? <span class="action-link" onclick="toggleAuthMode()">Đăng nhập</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ... (Phần MÀN HÌNH TRANG CHỦ và MODAL BÀI VIẾT/PROFILE giữ nguyên như code trước) ... -->

    <script>
        // KẾT NỐI SUPABASE
        const supabaseUrl = 'https://ldkwuvqzadkunzauzfvt.supabase.co';
        const supabaseKey = 'sb_publishable_TTMQlwyRGeMX5xSs_UIM3g_gfl89Rfg';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        let regTempEmail = '';
        let regTempName = '';

        // --- ĐIỀU HƯỚNG GIAO DIỆN AUTH ---
        function toggleAuthMode() {
            const loginSec = document.getElementById('login-section');
            const regSec = document.getElementById('register-section');
            
            // Reset lại form đăng ký về bước 1 mỗi khi chuyển đổi
            if (loginSec.style.display === 'none') {
                loginSec.style.display = 'block';
                regSec.style.display = 'none';
            } else {
                loginSec.style.display = 'none';
                regSec.style.display = 'block';
                setRegStep(1); 
            }
        }

        // Chuyển đổi mượt mà giữa các bước đăng ký
        function setRegStep(stepNum) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active-step'));
            document.getElementById(`reg-step-${stepNum}`).classList.add('active-step');
            
            // Ẩn nút "Bạn đã có tài khoản? Đăng nhập" ở bước 2 và 3 cho đỡ rối mắt
            const toggleText = document.getElementById('reg-toggle-text');
            if (stepNum === 1) {
                toggleText.style.display = 'block';
            } else {
                toggleText.style.display = 'none';
            }
        }

        // --- LOGIC ĐĂNG KÝ ---
        async function sendOTP() {
            regTempName = document.getElementById('reg-name').value;
            regTempEmail = document.getElementById('reg-email').value;
            
            if (!regTempEmail || !regTempName) return alert('Vui lòng nhập đầy đủ Tên và Email');
            
            document.getElementById('btn-send-otp').innerText = 'Đang xử lý...';
            const { error } = await supabase.auth.signInWithOtp({ email: regTempEmail });
            
            document.getElementById('btn-send-otp').innerText = 'Tiếp tục';
            if (error) alert('Lỗi: ' + error.message);
            else setRegStep(2); // Chuyển sang giao diện nhập mã OTP
        }

        async function verifyOTP() {
            const otp = document.getElementById('reg-otp').value;
            if (otp.length !== 6) return alert('Mã xác minh phải gồm 6 chữ số');
            
            document.getElementById('btn-verify-otp').innerText = 'Đang kiểm tra...';
            const { data, error } = await supabase.auth.verifyOtp({ email: regTempEmail, token: otp, type: 'email' });
            
            document.getElementById('btn-verify-otp').innerText = 'Xác nhận';
            if (error) alert('Mã không hợp lệ hoặc đã hết hạn');
            else {
                currentUser = data.user;
                setRegStep(3); // Chuyển sang giao diện đặt mật khẩu
            }
        }

        async function completeRegistration() {
            const pwd = document.getElementById('reg-password').value;
            const pwdConfirm = document.getElementById('reg-password-confirm').value;
            
            if (pwd !== pwdConfirm) return alert('Mật khẩu xác nhận không khớp');
            if (pwd.length < 6) return alert('Mật khẩu phải từ 6 ký tự');

            const { error } = await supabase.auth.updateUser({ 
                password: pwd,
                data: { display_name: regTempName }
            });

            if (error) {
                alert('Lỗi đặt mật khẩu: ' + error.message);
            } else {
                await supabase.from('profiles').insert([{ id: currentUser.id, display_name: regTempName }]);
                // Sau khi hoàn thành, chuyển thẳng vào trang chủ
                document.getElementById('auth-screen').classList.remove('active');
                document.getElementById('home-screen').classList.add('active');
                fetchPosts();
            }
        }

        // ... (Phần code Đăng nhập, Đăng bài và Load bản tin giữ nguyên) ...
    </script>
</body>
</html>
